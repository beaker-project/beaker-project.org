name: Build beaker-project.org

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-website:
    runs-on: ubuntu-latest
    container: 
      image: centos:7
      volumes:
        - /node20217:/node20217:rw,rshared
        - /node20217:/__e/node20:ro,rshared
    steps:
      - name: Fetch Node 20
        run: |
          curl -LO https://unofficial-builds.nodejs.org/download/release/v20.9.0/node-v20.9.0-linux-x64-glibc-217.tar.xz
          tar -xf node-v20.9.0-linux-x64-glibc-217.tar.xz --strip-components 1 -C /node20217
      - name: Fixup CentOS repo files
        run: |
          sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/*.repo
          sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo
          sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo
      - name: Setup environment
        run: |
          yum install -y epel-release python3
          yum install -y make nodejs python-genshi python-dateutil python-dulwich
      - name: Setup IUS repository
        run: |
          curl --fail --location --silent --show-error https://vault.ius.io/RPM-GPG-KEY-IUS-7 --output /etc/pki/rpm-gpg/RPM-GPG-KEY-IUS-7
          cat <<'EOF' > /etc/yum.repos.d/ius.repo
          [ius]
          name=IUS
          baseurl=https://vault.ius.io/el7/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-IUS-7
          EOF
          yum install -y git236-core
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          path: website
      - name: Checkout beaker repository
        uses: actions/checkout@v4
        with:
          path: beaker
          repository: beaker-project/beaker
          ref: 'master'
          fetch-depth: 0
          fetch-tags: true
      - name: Cache Beaker's release tarballs
        uses: actions/cache@v3
        with:
          path: website/releases
          # XXX: This is not unique - cache has to be manually removed
          key: cache
      - name: Fetch Beaker's release tarballs
        run: |
          pushd website
          make clean
          make
      - name: Archive website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: website
